<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title class="titulo">Login - Sistema de Vendas</title>
</head>
<body>
    <h2 class="titulo-menor">Entrar no Sistema</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="color: {% if category == 'danger' %}red{% else %}green{% endif %};">
              {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form class="form-login" action="/login" method="POST">
        <label class="titulo-interno">Login:</label>
        <input type="text" name="login" required>
        <br><br>
        <label class="titulo-interno">Senha:</label>
        <input type="password" name="senha" required>
        <br><br>
        <button type="submit">Entrar</button>
    </form>

    <p>Não tem conta? <a href="/cadastrar_usuario">Cadastre-se aqui</a></p>
</body>
</html>
